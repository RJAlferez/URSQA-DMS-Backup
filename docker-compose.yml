# =============================================================
# URS-DMS — Docker Compose
# Sprint 1: postgres + minio + pgadmin + server (foundation only)
# =============================================================
# Usage:
#   docker compose up -d        # start everything in the background
#   docker compose down         # stop everything (keeps volumes)
#   docker compose down -v      # stop + delete volumes (RESET)
#   docker compose logs -f server
# =============================================================

name: urs-dms

services:
  # Optional self-hosted SMTP/IMAP server. Start with:
  #   docker compose --profile mail up -d mailserver
  # Configure a real domain and DNS records before sending external mail.
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: urs-mailserver
    hostname: mail
    domainname: ${MAIL_DOMAIN:-example.com}
    profiles: ["mail"]
    env_file:
      - ./docker/mailserver/mailserver.env
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - urs-mail-data:/var/mail
      - urs-mail-state:/var/mail-state
      - urs-mail-logs:/var/log/mail
      - urs-mail-config:/tmp/docker-mailserver
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    restart: unless-stopped
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # PostgreSQL 16 — primary database
  # ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: urs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urs_password}
      POSTGRES_DB: ${POSTGRES_DB:-urs_dms}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - urs-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urs_user} -d ${POSTGRES_DB:-urs_dms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage
  # ────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: urs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urs_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-urs_minio_secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://urs-dms.online}
    volumes:
      - urs-minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # pgAdmin 4 — Web UI for postgres (optional but useful)
  # ────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: urs-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@urs-dms.internal}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    volumes:
      - urs-pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # Redis 7 — BullMQ queue backend + session cache
  # ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: urs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - urs-redis-data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # URS-DMS server — Node.js + Express + Prisma
  # ────────────────────────────────────────────────────────
  server:
    image: urs-dms-server:local
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: urs-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override docker-internal hostnames
      DATABASE_URL: postgresql://${POSTGRES_USER:-urs_user}:${POSTGRES_PASSWORD:-urs_password}@urs-postgres:5432/${POSTGRES_DB:-urs_dms}?schema=public&connection_limit=20&pool_timeout=30
      PUBLIC_APP_URL: http://localhost:5173
      CLIENT_URL: http://localhost:5173,http://127.0.0.1:5173
      MINIO_ENDPOINT: urs-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      # This must be reachable by the browser for presigned upload/download URLs.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://minio.localhost:9000}
      REDIS_HOST: urs-redis
      REDIS_PORT: 6379
      GOTENBERG_URL: http://gotenberg:3000
      NODE_ENV: production
      PORT: 4000
    extra_hosts:
      - "minio.localhost:host-gateway"
    volumes:
      - urs-server-logs:/app/logs
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # URS-DMS frontend — Vite build served by Nginx
  # ────────────────────────────────────────────────────────
  frontend:
    image: urs-dms-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
    container_name: urs-frontend
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: server:4000
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - urs-net

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: urs-gotenberg
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - urs-net

# ────────────────────────────────────────────────────────────
# Named volumes (persist data across `docker compose down`)
# ────────────────────────────────────────────────────────────
volumes:
  urs-mail-data:
    driver: local
  urs-mail-state:
    driver: local
  urs-mail-logs:
    driver: local
  urs-mail-config:
    driver: local
  urs-postgres-data:
    driver: local
  urs-minio-data:
    driver: local
  urs-pgadmin-data:
    driver: local
  urs-redis-data:
    driver: local
  urs-server-logs:
    driver: local

# ────────────────────────────────────────────────────────────
# Custom network (DNS by service name, isolation)
# ────────────────────────────────────────────────────────────
networks:
  urs-net:
    driver: bridge
