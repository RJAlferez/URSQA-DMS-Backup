# =============================================================================
# URS-DMS — Nginx config for the frontend container.
#
# - Serves the built SPA from /usr/share/nginx/html
# - SPA fallback to /index.html for client-side routes
# - Reverse-proxies /api/* to the backend service over the internal Dokploy
#   network. The backend host is injected at container start from the
#   BACKEND_UPSTREAM env var (default: urs-server:4000) because Dokploy
#   randomizes container names.

# Preserve the original client scheme (https) forwarded by the TLS-terminating
# proxy (Traefik) instead of letting nginx overwrite it with its own $scheme
# (http, since Traefik->nginx is plain HTTP). Without this the backend mints
# http:// file upload/download URLs that browsers reject as mixed content.
map $http_x_forwarded_proto $urs_xfp {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream urs_backend {
    server ${BACKEND_UPSTREAM};
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security headers (helmet-equivalent). CSP omitted so it can be tuned
    # per deployment without rebuilding the image.
    # HSTS forces every browser to load this site over HTTPS forever, so the
    # address bar never drops back to "Not secure" (e.g. after a stale http
    # cache or an old http:// presigned upload URL). Host-only: subdomains
    # such as www are redirected by Traefik, not served over their own TLS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Long-cache hashed Vite assets
    # NOTE: a location that declares any `add_header` drops the server-level
    # ones, so the security headers must be repeated here (nginx inheritance).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|wasm)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Reverse-proxy API + file streaming routes
    location /api/ {
        proxy_pass http://urs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $urs_xfp;
        proxy_set_header Connection        "";

        # Long timeouts for presigned upload/download round-trips and ZIP
        # export streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # File uploads can be large; the backend already caps JSON at 1 MB
        # but multipart streams (upload/download through /api/v1/files/*)
        # need room.
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # SPA fallback for everything else
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html so deploys are picked up immediately
    # (add_header must be repeated here too — see the assets location note.)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires 0;
    }
}
